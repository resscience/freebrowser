name: Build FreeBrowser for Windows

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:   # اجازه اجرای دستی از تب Actions

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.20.4'
        cache: false

    # --- مرحله تشخیصی: ساختار پروژه را چاپ کن ---
    - name: Show project structure
      shell: bash
      run: |
        echo "=== Root ==="
        ls -la
        echo "=== cmd folder ==="
        ls -la cmd || true
        echo "=== freebrowser/desktop folder ==="
        ls -la freebrowser/desktop || true
        echo "=== freebrowser/desktop/files folder ==="
        ls -la freebrowser/desktop/files || true

    - name: Install goversioninfo
      run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

    - name: Build proxy (fbproxy)
      shell: bash
      run: |
        cd cmd
        ./build-proxy.sh --os=windows

    # --- مرحله تشخیصی: ببینیم fbproxy.exe کجا ساخته شده ---
    - name: Find fbproxy output
      shell: bash
      run: |
        echo "=== Searching for fbproxy* ==="
        find . -name "fbproxy*" -type f || true

    - name: Copy proxy executable
      shell: bash
      run: |
        # اگر فایل در cmd است، کپی کن
        cp cmd/fbproxy.exe freebrowser/desktop/files/ 2>/dev/null || \
        cp cmd/fbproxy-windows.exe freebrowser/desktop/files/fbproxy.exe

    - name: Build browser executable
      shell: bash
      run: |
        cd freebrowser/desktop
        ./build-browser.sh --os=windows

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: freebrowser-windows
        path: freebrowser/desktop/freebrowser.exe
