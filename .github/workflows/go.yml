name: Build FreeBrowser for Windows

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'
        cache: false

    - name: Initialize Go module
      shell: bash
      run: |
        go mod init fb-proxy || true
        go mod edit -go=1.26
        go mod tidy

    - name: Install goversioninfo
      run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

    - name: Build proxy (fbproxy)
      shell: bash
      run: |
        cd cmd
        bash build-proxy.sh --os=windows
        ls -la

    - name: Copy proxy executable
      shell: bash
      run: |
        if [ -f cmd/fbproxy.exe ]; then
          cp cmd/fbproxy.exe freebrowser/desktop/files/fbproxy.exe
        elif [ -f cmd/fbproxy-windows.exe ]; then
          cp cmd/fbproxy-windows.exe freebrowser/desktop/files/fbproxy.exe
        else
          echo "fbproxy.exe not found, searching..."
          find . -name "fbproxy*.exe" -exec cp {} freebrowser/desktop/files/fbproxy.exe \;
        fi
        ls -la freebrowser/desktop/files/

    - name: Build browser executable
      shell: bash
      run: |
        cd freebrowser/desktop
        bash build-browser.sh --os=windows
        ls -la

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: freebrowser-windows
        path: freebrowser/desktop/freebrowser.exe
