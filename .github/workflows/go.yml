name: Build FreeBrowser for Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. Checkout باید همیشه اولین مرحله باشد
    - name: Checkout code
      uses: actions/checkout@v5   # ✅ به‌روزرسانی به v5 (سازگار با Node.js 24)

    # 2. Setup Go با غیرفعال کردن cache (چون پروژه go.sum ندارد)
    - name: Setup Go
      uses: actions/setup-go@v6   # ✅ به‌روزرسانی به v6 (سازگار با Node.js 24)
      with:
        go-version: '1.20.4'
        cache: false   # ⚠️ این خط بسیار مهم است: کش را غیرفعال می‌کند

    - name: Install goversioninfo
      run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

    - name: Build proxy (fbproxy)
      run: |
        cd cmd
        ./build-proxy.sh --os=windows

    - name: Copy proxy executable
      run: copy cmd\fbproxy.exe freebrowser\desktop\files\

    - name: Build browser executable
      run: |
        cd freebrowser\desktop
        ./build-browser.sh --os=windows

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: freebrowser-windows
        path: freebrowser/desktop/freebrowser.exe
